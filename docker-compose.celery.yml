version: '3.8'

services:
  # Redis service for Celery message broker and result backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - USE_LOCAL_DB=true
      - DOCKER_ENV=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite-preview-06-17}
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn fast_api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery worker for regular RAG queries
  celery-worker:
    build: .
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - USE_LOCAL_DB=true
      - DOCKER_ENV=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite-preview-06-17}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=4 --queues=rag_queries
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery worker for streaming RAG queries  
  celery-worker-stream:
    build: .
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - USE_LOCAL_DB=true
      - DOCKER_ENV=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite-preview-06-17}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=2 --queues=rag_streams
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:

networks:
  celery_network:
    driver: bridge 