[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.(py|pyi)$"
exclude = [
    "/venv/",
    "/.venv/",
    "/.git/",
    "/.mypy_cache/",
    "/.ruff_cache/",
    "/.pytest_cache/",
]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["app", "tests"]
force_sort_within_sections = true
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests", "."]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]


