[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.(py|pyi)$"
extend-exclude = '''
/(
    venv
    | \.venv
    | \.git
    | \.mypy_cache
    | \.ruff_cache
    | \.pytest_cache
    | \.claude
)/
'''

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["app", "tests"]
force_sort_within_sections = true
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = [
    ".claude",
    ".git",
    "venv",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Function call in default argument - FastAPI uses Query(), Depends() etc.
    "E402",  # Module level import not at top - often needed for circular import avoidance
    "E501",  # Line too long - temporarily ignored, TODO: fix remaining 408 long lines
]

[tool.ruff.lint.per-file-ignores]
# These files contain long URLs and markdown tables in LLM prompts that cannot be broken
"app/services/agents/tool_aware_agent.py" = ["E501"]
"app/services/response/v3_response_formatter.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
