# Scenario: Basic Project Search
# Tests the standard flow of searching for funded projects
# PRD Task 007: Project Search Scenario

name: "Project Search"
description: "User searches for funded projects and explores details (AI healthcare focus)"
tags: ["basic", "projects", "search"]
stop_on_error: true

steps:
  - message: "Show me recent AI healthcare projects"
    validations:
      - type: "response_contains"
        name: "mentions_projects"
        patterns: ["project"]
      - type: "tools_used"
        name: "uses_project_search"
        expected: ["search_projects"]
      - type: "no_error"
        name: "no_errors"
    delay_ms: 0

  - message: "What was the budget of the largest one?"
    validations:
      - type: "follow_up_resolved"
        name: "resolves_reference"
        description: "Should understand 'the largest one' reference"
      - type: "response_contains_any"
        name: "mentions_budget"
        patterns: ["budget", "funding", "million", "EUR", "€"]
      - type: "no_error"
        name: "no_errors"
    delay_ms: 500

  - message: "Who coordinated it?"
    validations:
      - type: "follow_up_resolved"
        name: "resolves_reference"
        description: "Should understand 'it' refers to the largest project"
      - type: "response_contains_any"
        name: "mentions_coordinator"
        patterns: ["coordinator", "coordinated", "lead", "organization", "university", "institute"]
      - type: "no_error"
        name: "no_errors"
    delay_ms: 500

final_validations:
  - type: "context_integrity"
    name: "context_preserved"
    description: "All 3 messages should be in context"
  - type: "quality_non_degradation"
    name: "quality_stable"
    description: "Quality should not drop significantly"
