# Multi-Call Timeline Scenario (Task 033)
# Tests the system's ability to help users plan submissions to multiple calls
# within a quarter, handling staggered deadlines, contingency planning, and
# backup call identification.
#
# User Journey:
# 1. User wants to apply to 3 calls this quarter
# 2. User asks for climate and energy calls with staggered deadlines
# 3. User asks for help planning their submission timeline
# 4. User asks what if one call deadline changes
# 5. User asks for alternative calls as backup
#
# Required Validation Types (per PRD):
# - no_error (Built-in): Error detection
# - response_contains_any (Built-in): Pattern matching for timeline content
# - programme_mentioned (CrossProgrammeAgent): Programmes discussed
# - programme_accurate (CrossProgrammeAgent): Call information correct
# - goal_progress (GoalTrackingAgent): Progress toward multi-call planning goal
# - goal_achieved (GoalTrackingAgent): User has multi-call plan with contingencies
# - context_accumulated (PersonalizationAgent): User context builds across turns
# - profile_used (PersonalizationAgent): Profile used for recommendations
# - personalization_applied (PersonalizationAgent): Response personalized
# - context_integrity (ContextValidatorAgent): All messages stored correctly
#
# Key Test: System should provide multi-call planning with staggered deadlines,
# help plan submission timelines, consider contingency scenarios when deadlines
# change, and suggest backup alternatives.
# Note: Due to LLM response variability, validations use broad patterns
# and lenient thresholds to ensure consistent test results.

name: "Multi-Call Timeline"
description: |
  A 5-step multi-call planning workflow where a user wants to apply to 3 calls
  this quarter in climate and energy topics, needs help planning staggered
  submissions, considering deadline changes, and identifying backup options.
  Tests the system's ability to manage multi-call submission strategies.
tags: ["phase7", "deadlines", "multi-call", "timeline", "planning", "climate", "energy", "contingency"]
stop_on_error: false

