          # Quality patterns
          - "quality"
          - "excellence"
          - "strong"
          - "high"
          - "good"
          - "well"
          - "carefully"
          # Consortium patterns
          - "consortium"
          - "partner"
          - "partners"
          - "partnership"
          - "team"
          - "collaboration"
          - "collaborative"
          - "network"
          - "composition"
          - "complementary"
          # Experience patterns
          - "experience"
          - "experienced"
          - "track record"
          - "track-record"
          - "previous"
          - "prior"
          - "history"
          - "past"
          # Proposal quality patterns
          - "proposal"
          - "writing"
          - "write"
          - "written"
          - "structure"
          - "clear"
          - "clarity"
          - "coherent"
          - "coherence"
          - "concise"
          - "compelling"
          # Impact patterns
          - "impact"
          - "impacts"
          - "dissemination"
          - "exploitation"
          - "market"
          - "society"
          - "societal"
          # Topic alignment patterns
          - "align"
          - "alignment"
          - "fit"
