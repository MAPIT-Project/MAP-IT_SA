      - type: "goal_progress"
        name: "success_factors_complete"
        min_progress: 0.35

      # PersonalizationAgent: Response should use accumulated profile
      - type: "profile_used"
        name: "profile_used_for_factors"
        expected_fields: []

      # PersonalizationAgent: Response should be personalized
      - type: "personalization_applied"
        name: "factors_response_personalized"
    delay_ms: 500

final_validations:
  # GoalTrackingAgent: User should understand success rates and factors
  - type: "goal_achieved"
    name: "success_rate_analysis_goal_achieved"
    min_progress: 0.40

  # PersonalizationAgent: Full profile should have accumulated
  - type: "context_accumulated"
    name: "complete_context_accumulated"
    min_fields: 0

  # ContextValidatorAgent: All 6 messages should be stored correctly
  - type: "context_integrity"
    name: "all_6_messages_preserved"
