          - "effort"
          - "resources"
          # Call type patterns
          - "RIA"
          - "IA"
          - "CSA"
          - "EIC"
          - "ERC"
          - "call"
          - "calls"

      # GoalTrackingAgent: Progress with prioritization
      - type: "goal_progress"
        name: "prioritization_provided"
        min_progress: 0.30

      # PersonalizationAgent: Prioritization should use profile
      - type: "profile_used"
        name: "profile_used_for_prioritization"
        expected_fields: []

      # PersonalizationAgent: Response should be personalized
      - type: "personalization_applied"
        name: "prioritization_response_personalized"
    delay_ms: 500

  # Step 5: User asks about avoiding overlap
  - message: "How do we avoid overlap?"
    validations:
      - type: "no_error"
        name: "no_errors_step5"

      - type: "response_contains_any"
