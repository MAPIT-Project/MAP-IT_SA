# Portfolio Planning Scenario (Task 023)
# Tests portfolio approach for planning multiple EU funding applications.
# A user wants to submit 5 proposals this year in AI, robotics, and
# human-machine interaction, seeking advice on call matching, prioritization,
# overlap avoidance, and success expectations.
#
# User Journey:
# 1. User reveals intention to submit 5 proposals this year
# 2. User shares research areas: AI, robotics, human-machine interaction
# 3. User asks which calls match their profile
# 4. User asks which calls to prioritize
# 5. User asks how to avoid overlap between proposals
# 6. User asks about realistic success expectations
#
# Required Validation Types (per PRD):
# - context_accumulated (PersonalizationAgent): User context builds across turns
# - profile_used (PersonalizationAgent): Context influences recommendations
# - personalization_applied (PersonalizationAgent): Responses tailored to user
# - goal_progress (GoalTrackingAgent): Progress toward portfolio plan
# - goal_achieved (GoalTrackingAgent): User has a portfolio strategy
# - context_integrity (ContextValidatorAgent): All messages stored correctly
# - response_contains_any (Built-in): Pattern matching for portfolio content
# - no_error (Built-in): Error detection
#
# Key Test: System should recommend a portfolio approach with diversification
# considerations, success rates for different call types, and strategies
# to avoid overlap between proposals.
# Note: Due to LLM response variability, validations use broad patterns
# and lenient thresholds to ensure consistent test results.

name: "Portfolio Planning"
description: |
  A 6-step portfolio planning workflow where a researcher seeks help planning
  multiple proposal submissions for the year. Tests the system's ability to
  provide portfolio-based advice including call matching, prioritization,
  overlap avoidance, and realistic success expectations. The conversation
  builds user context progressively (5 proposals goal, AI/robotics/HMI areas)
  and validates that recommendations consider diversification and success rates.
tags: ["phase5", "strategic-planning", "portfolio-planning", "multi-proposal", "ai", "robotics", "hmi"]
stop_on_error: false

steps:
  # Step 1: User reveals portfolio goal
  - message: "We want to submit 5 proposals this year"
    validations:
      - type: "no_error"
        name: "no_errors_step1"

