          - "more"
          - "about"
          - "information"
          - "understand"
          - "know"
          - "details"
          - "context"
          # Research area patterns
          - "research"
          - "area"
          - "areas"
          - "field"
          - "focus"
          - "topics"
          # Funding patterns
