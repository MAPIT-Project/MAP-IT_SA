      # GoalTrackingAgent: Initial progress
      - type: "goal_progress"
        name: "portfolio_planning_started"
        min_progress: 0.05

      # PersonalizationAgent: Context should start building
      - type: "context_accumulated"
        name: "initial_context"
        min_fields: 0
    delay_ms: 0

  # Step 2: User shares research areas
  - message: "Our research areas are: AI, robotics, and human-machine interaction"
    validations:
      - type: "no_error"
        name: "no_errors_step2"

      - type: "response_contains_any"
        name: "acknowledges_research_areas"
        patterns:
          # AI patterns
          - "AI"
          - "artificial intelligence"
          - "machine learning"
          - "deep learning"
          - "neural"
          - "intelligent"
          # Robotics patterns
