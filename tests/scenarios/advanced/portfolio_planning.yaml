      - type: "personalization_applied"
        name: "calls_response_personalized"
    delay_ms: 500

  # Step 4: User asks which calls to prioritize
  - message: "Which should we prioritize?"
    validations:
      - type: "no_error"
        name: "no_errors_step4"

      - type: "response_contains_any"
