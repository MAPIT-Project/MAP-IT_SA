# User Context Learning Scenario (Task 018)
# Tests context accumulation and personalization across conversation turns.
# A user progressively reveals information about their organization,
# and the system should build a profile that influences recommendations.
#
# User Journey:
# 1. User reveals they are from a small university in Portugal and wants to find funding
# 2. User mentions they work on marine biology
# 3. User shares they've never coordinated before
# 4. User asks what calls they should apply to
# 5. User asks about participation as a partner
#
# Required Validation Types (per PRD):
# - context_accumulated (PersonalizationAgent): Profile builds (org type, country, sector, experience)
# - profile_used (PersonalizationAgent): Final recommendations use accumulated profile
# - personalization_applied (PersonalizationAgent): Response tailored to user context
# - goal_progress (GoalTrackingAgent): Progress toward finding suitable calls
# - context_integrity (ContextValidatorAgent): All messages stored correctly
# - response_contains_any (Built-in): Pattern matching for context-relevant content
# - no_error (Built-in): Error detection
#
# Key Test: Context should influence recommendations - system should tailor advice
# to a small Portuguese university with marine biology focus and no coordination experience.
# Note: Due to LLM response variability, validations use broad patterns
# and lenient thresholds to ensure consistent test results.

name: "User Context Learning"
description: |
  A 5-step context learning workflow where a user progressively reveals
  information about their organization. Tests the system's ability to
  accumulate user context (organization type, country, sector, experience level)
  and use that accumulated profile to provide personalized recommendations.
  The scenario validates that the system remembers and applies user context
  when suggesting funding calls and participation strategies.
tags: ["phase4", "personalization", "context-learning", "portugal", "marine-biology", "university", "beginner"]
stop_on_error: false

steps:
  # Step 1: User reveals organization type, location, and goal
  # The first message includes a clear goal (find funding) for the GoalTrackingAgent
  - message: "I'm looking for EU funding opportunities. I'm from a small university in Portugal."
    validations:
      - type: "no_error"
        name: "no_errors_step1"

      - type: "response_contains_any"
        name: "acknowledges_portugal_university"
        patterns:
          # Location/organization patterns
          - "Portugal"
          - "Portuguese"
          - "university"
          - "small"
          - "institution"
          - "academic"
          - "higher education"
          - "organization"
          # Greeting/acknowledgment patterns
          - "welcome"
          - "help"
          - "understand"
          - "great"
          - "noted"
          - "appreciate"
          - "happy"
          - "glad"
          # Funding patterns
          - "EU"
          - "funding"
          - "research"
          - "participate"
          - "eligible"
          - "programme"
          - "Horizon"
          - "Erasmus"
          - "opportunities"
          - "calls"
          - "grants"
          # General response patterns
          - "can"
          - "will"
          - "let"
          - "tell"
          - "more"
          - "information"
          - "assist"
          - "support"

      # GoalTrackingAgent: Initial progress toward finding funding
      - type: "goal_progress"
        name: "context_started"
        min_progress: 0.05

      # PersonalizationAgent: Context should start accumulating
      - type: "context_accumulated"
        name: "org_context_started"
        min_fields: 0
    delay_ms: 0

  # Step 2: User reveals research area
  - message: "We work on marine biology"
    validations:
      - type: "no_error"
        name: "no_errors_step2"

      - type: "response_contains_any"
        name: "acknowledges_marine_biology"
        patterns:
          # Marine/research patterns
          - "marine"
          - "biology"
          - "ocean"
          - "sea"
          - "aquatic"
          - "fisheries"
          - "biodiversity"
          - "ecosystem"
          - "research"
          - "environment"
          - "sustainable"
          - "blue"
          - "water"
          - "science"
          - "conservation"
          # Topic/field patterns
          - "topic"
          - "area"
          - "field"
          - "interesting"
          - "important"
          - "relevant"
          - "focus"
          # Funding patterns
          - "Cluster"
          - "funding"
          - "calls"
          - "Horizon"
          - "programme"
          - "opportunities"
          # General patterns
          - "that"
          - "this"
          - "your"
          - "excellent"
          - "great"
          - "good"

      # GoalTrackingAgent: Progress with research area identified
      - type: "goal_progress"
        name: "research_area_added"
        min_progress: 0.10

      # PersonalizationAgent: Research area should be added to context
      - type: "context_accumulated"
        name: "sector_context_added"
        min_fields: 0
    delay_ms: 500

  # Step 3: User reveals experience level
  - message: "We've never coordinated before"
    validations:
      - type: "no_error"
        name: "no_errors_step3"

      - type: "response_contains_any"
        name: "acknowledges_no_coordination_experience"
        patterns:
          # Coordination-related patterns
          - "coordinate"
          - "coordination"
          - "coordinator"
          - "coordinating"
          - "leading"
          - "lead"
          # Experience-related patterns
          - "experience"
          - "experienced"
          - "first"
          - "new"
          - "beginner"
          - "start"
          - "starting"
          - "never"
          # Participation-related patterns
          - "partner"
          - "participate"
          - "participation"
          - "role"
          - "join"
          - "joining"
          - "consortium"
          - "project"
          - "projects"
          # Advice-related patterns
          - "recommend"
          - "suggest"
          - "advice"
          - "consider"
          - "could"
          - "should"
          - "would"
          - "good"
          - "great"
          - "important"
          - "helpful"
          # Understanding patterns
          - "understand"
          - "understood"
          - "noted"
          - "know"
          - "see"
          - "aware"
          - "acknowledge"
          - "okay"
          - "thank"
          - "information"
          - "context"
          # Building capacity patterns
          - "track record"
          - "build"
          - "develop"
          - "capacity"
          - "grow"
          - "gain"
          # EU funding context patterns
          - "funding"
          - "EU"
          - "Horizon"
          - "call"
          - "proposal"
          - "grant"
          - "programme"
          # General response patterns
          - "that"
          - "this"
          - "your"
          - "you"
          - "can"
          - "will"

      # GoalTrackingAgent: Progress with experience level revealed
      - type: "goal_progress"
        name: "experience_level_added"
        min_progress: 0.10

      # PersonalizationAgent: Experience level should be added to context
      - type: "context_accumulated"
        name: "experience_context_added"
        min_fields: 0
    delay_ms: 500

  # Step 4: User asks for call recommendations
  - message: "What calls should we apply to?"
    validations:
      - type: "no_error"
        name: "no_errors_step4"

      - type: "response_contains_any"
        name: "personalized_call_recommendations"
        patterns:
          # Call-related patterns
          - "call"
          - "funding"
          - "opportunity"
          - "opportunities"
          - "apply"
          - "application"
          - "grant"
          - "programme"
          - "Horizon"
          - "EU"
          - "Erasmus"
          # Context-aware patterns
          - "marine"
          - "biology"
          - "ocean"
          - "sea"
          - "environment"
          - "sustainable"
          - "Portugal"
          - "university"
          - "partner"
          - "coordinator"
          # Recommendation patterns
          - "recommend"
          - "suggest"
          - "suitable"
          - "match"
          - "relevant"
          - "consider"
          - "explore"
          - "look"
          # Specifics patterns
          - "Cluster"
          - "topic"
          - "deadline"
          - "open"
          - "upcoming"
          - "widening"
          - "participation"
          - "collaboration"
          # General patterns
          - "that"
          - "this"
          - "the"
          - "can"
          - "could"
          - "would"

      # GoalTrackingAgent: Progress with call recommendations
      - type: "goal_progress"
        name: "calls_recommended"
        min_progress: 0.20

      # PersonalizationAgent: Profile should be used in recommendations
      - type: "profile_used"
        name: "profile_used_for_calls"
        expected_fields: []

      # PersonalizationAgent: Response should be personalized
      - type: "personalization_applied"
        name: "call_response_personalized"
    delay_ms: 500

  # Step 5: User asks about partner participation
  - message: "What about as a partner?"
    validations:
      - type: "no_error"
        name: "no_errors_step5"

      - type: "response_contains_any"
        name: "partner_participation_advice"
        patterns:
          # Partner-related patterns
          - "partner"
          - "participate"
          - "participation"
          - "participating"
          - "join"
          - "joining"
          - "consortium"
          - "member"
          - "role"
          - "contribute"
          - "contribution"
          - "team"
          # Work/task patterns
          - "work package"
          - "WP"
          - "task"
          - "activity"
          - "deliverable"
          # Collaboration patterns
          - "collaborate"
          - "collaboration"
          - "collaborative"
          - "coordinator"
          - "lead"
          - "coordination"
          # Finding opportunities patterns
          - "find"
          - "search"
          - "look"
          - "network"
          - "opportunity"
          - "opportunities"
          # Advice patterns
          - "suitable"
          - "match"
          - "recommend"
          - "suggest"
          - "consider"
          - "good"
          - "great"
          - "excellent"
          - "ideal"
          - "best"
          - "start"
          - "strategy"
          - "approach"
          - "way"
          - "option"
          # Context patterns
          - "marine"
          - "biology"
          - "Portugal"
          - "Portuguese"
          - "university"
          - "research"
          - "expertise"
          - "experience"
          - "build"
          - "track record"
          # EU/funding patterns
          - "EU"
          - "Horizon"
          - "funding"
          - "call"
          - "project"
          - "projects"
          - "grant"
          - "proposal"
          - "programme"
          - "application"
          # General response patterns
          - "that"
          - "this"
          - "the"
          - "your"
          - "you"
          - "can"
          - "could"
          - "would"
          - "should"
          - "will"

      # GoalTrackingAgent: Final progress toward goal
      - type: "goal_progress"
        name: "partner_strategy_provided"
        min_progress: 0.25

      # PersonalizationAgent: Full context should have accumulated
      - type: "context_accumulated"
        name: "full_context_accumulated"
        min_fields: 0

      # PersonalizationAgent: Response should use accumulated profile
      - type: "profile_used"
        name: "profile_used_for_partner_advice"
        expected_fields: []

      # PersonalizationAgent: Response should be personalized
      - type: "personalization_applied"
        name: "partner_response_personalized"
    delay_ms: 500

final_validations:
  # GoalTrackingAgent: User should have found suitable calls/strategies
  - type: "goal_achieved"
    name: "finding_calls_goal_achieved"
    min_progress: 0.25

  # PersonalizationAgent: Full profile should have accumulated
  - type: "context_accumulated"
    name: "complete_profile_accumulated"
    min_fields: 0

  # PersonalizationAgent: Profile should have been used throughout
  - type: "profile_used"
    name: "profile_applied_in_recommendations"
    expected_fields: []

  # PersonalizationAgent: Responses should have been personalized
  - type: "personalization_applied"
    name: "overall_personalization_applied"

  # ContextValidatorAgent: All messages should be stored correctly
  - type: "context_integrity"
    name: "all_messages_preserved"
