      # GoalTrackingAgent: Strategy should be complete
      - type: "goal_progress"
        name: "timeline_provided"
        min_progress: 0.45

      # PersonalizationAgent: Full context should be accumulated
      - type: "context_accumulated"
        name: "full_context_for_timeline"
        min_fields: 0

      # PersonalizationAgent: Timeline should use accumulated profile
      - type: "profile_used"
        name: "profile_used_for_timeline"
        expected_fields: []

      # PersonalizationAgent: Response should be personalized
      - type: "personalization_applied"
        name: "timeline_response_personalized"
    delay_ms: 500

final_validations:
  # GoalTrackingAgent: User should have a complete funding strategy
  - type: "goal_achieved"
    name: "funding_strategy_goal_achieved"
    min_progress: 0.40

  # PersonalizationAgent: Full profile should have accumulated
  - type: "context_accumulated"
    name: "complete_context_accumulated"
    min_fields: 0

  # ContextValidatorAgent: All 6 messages should be stored correctly
  - type: "context_integrity"
    name: "all_6_messages_preserved"
