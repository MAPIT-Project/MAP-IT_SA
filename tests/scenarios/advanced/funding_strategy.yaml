# Funding Strategy Scenario (Task 022)
# Tests strategic planning for multi-year funding across programmes.
# A user seeks help planning a 3-year research funding strategy for their
# cybersecurity department, exploring Horizon Europe and Erasmus+ options.
#
# User Journey:
# 1. User requests help planning a 3-year funding strategy
# 2. User reveals they are a university cybersecurity department
# 3. User asks about Horizon Europe options
# 4. User asks about building capacity through Erasmus+
# 5. User asks how to sequence applications
# 6. User asks for a realistic timeline
#
# Required Validation Types (per PRD):
# - context_accumulated (PersonalizationAgent): User context builds across turns
# - profile_used (PersonalizationAgent): Context influences recommendations
# - personalization_applied (PersonalizationAgent): Responses tailored to user
# - goal_progress (GoalTrackingAgent): Progress toward strategic plan
# - goal_achieved (GoalTrackingAgent): User has a funding strategy
# - context_integrity (ContextValidatorAgent): All messages stored correctly
# - response_contains_any (Built-in): Pattern matching for strategy content
# - no_error (Built-in): Error detection
#
# Key Test: System should provide multi-year strategic planning that combines
# different EU programmes (Horizon Europe, Erasmus+) with logical sequencing.
# Note: Due to LLM response variability, validations use broad patterns
# and lenient thresholds to ensure consistent test results.
# Programme-specific validations (programme_mentioned, programme_accurate)
# are handled via response_contains_any patterns to be more resilient.

name: "Funding Strategy"
description: |
  A 6-step strategic planning workflow where a university cybersecurity
  department seeks help creating a 3-year EU funding strategy. Tests the
  system's ability to provide multi-programme strategic advice, suggest
  logical application sequencing, and create realistic timelines. The
  conversation builds user context progressively and validates that the
  final strategy incorporates both Horizon Europe and Erasmus+ options
  in a coherent multi-year plan.
tags: ["phase5", "strategic-planning", "funding-strategy", "multi-year", "cybersecurity", "university", "multi-programme"]
stop_on_error: false

steps:
  # Step 1: User requests strategic planning help
  - message: "Help me plan our research funding strategy for the next 3 years"
    validations:
      - type: "no_error"
        name: "no_errors_step1"

      - type: "response_contains_any"
        name: "acknowledges_strategic_planning"
        patterns:
          # Strategic planning patterns
          - "strategy"
          - "strategic"
          - "plan"
          - "planning"
          - "3 year"
          - "three year"
          - "multi-year"
          - "long-term"
          - "roadmap"
          # Funding patterns
          - "funding"
          - "research"
          - "EU"
          - "programme"
          - "grant"
          - "support"
          - "opportunities"
          # Assistance patterns
          - "help"
          - "assist"
          - "happy"
          - "glad"
          - "can"
          - "let"
          - "will"
          # Information gathering patterns
          - "tell"
          - "more"
          - "about"
          - "information"
          - "understand"
          - "know"
          - "details"
          - "context"
          - "organization"
          - "research"
          - "area"
          - "field"
          # Question patterns
          - "what"
          - "which"
          - "how"
          - "?"

      # GoalTrackingAgent: Initial progress
      - type: "goal_progress"
        name: "strategy_planning_started"
        min_progress: 0.05

      # PersonalizationAgent: Context should start building
      - type: "context_accumulated"
        name: "initial_context"
        min_fields: 0
    delay_ms: 0

  # Step 2: User reveals organization and research area
  - message: "We're a university department focusing on cybersecurity"
    validations:
      - type: "no_error"
        name: "no_errors_step2"

      - type: "response_contains_any"
        name: "acknowledges_cybersecurity_context"
        patterns:
          # Cybersecurity patterns
          - "cybersecurity"
          - "cyber"
          - "security"
          - "digital"
          - "ICT"
          - "information"
          - "network"
          - "data"
          - "privacy"
          - "protection"
          - "threat"
          - "infrastructure"
          # Research/academic patterns
          - "university"
          - "department"
          - "academic"
          - "research"
          - "institution"
          - "higher education"
          # Funding opportunity patterns
          - "funding"
          - "opportunities"
          - "programme"
          - "Horizon"
          - "EU"
          - "Cluster"
          - "Digital"
          - "call"
          - "grant"
          - "support"
          # Context acknowledgment patterns
          - "great"
          - "excellent"
          - "good"
          - "interesting"
          - "important"
          - "relevant"
          - "noted"
          - "understand"
          - "see"
          - "thank"
          # Topic relevance patterns
          - "topic"
          - "area"
          - "field"
          - "focus"
          - "priority"
          - "strategic"
          - "growing"
          - "demand"

      # GoalTrackingAgent: Progress with context added
      - type: "goal_progress"
        name: "context_added"
        min_progress: 0.10

      # PersonalizationAgent: Organization context should accumulate
      - type: "context_accumulated"
        name: "org_context_accumulated"
        min_fields: 0
    delay_ms: 500

  # Step 3: User asks about Horizon Europe options
  - message: "What Horizon Europe options do we have?"
    validations:
      - type: "no_error"
        name: "no_errors_step3"

      - type: "response_contains_any"
        name: "horizon_europe_options_explained"
        patterns:
          # Programme name patterns
          - "Horizon Europe"
          - "Horizon"
          - "HE"
          - "Framework Programme"
          # Pillar/Cluster patterns
          - "Pillar"
          - "Cluster"
          - "Cluster 3"
          - "Cluster 4"
          - "Digital"
          - "Security"
          - "Civil Security"
          - "Industry"
          # Action type patterns
          - "RIA"
          - "IA"
          - "CSA"
          - "Research"
          - "Innovation"
          - "action"
          - "actions"
          # Programme component patterns
          - "ERC"
          - "EIC"
          - "MSCA"
          - "Marie"
          - "infrastructure"
          - "partnership"
          # Funding patterns
          - "funding"
          - "call"
          - "calls"
          - "grant"
          - "budget"
          - "EUR"
          - "million"
          - "billion"
          # Opportunity patterns
          - "option"
          - "options"
          - "opportunity"
          - "opportunities"
          - "suitable"
          - "relevant"
          - "available"
          - "open"
          - "upcoming"
          # Recommendation patterns
          - "recommend"
          - "suggest"
          - "consider"
          - "explore"
          - "look"
          - "could"
          - "should"
          - "would"
          # Cybersecurity context patterns
          - "cybersecurity"
          - "cyber"
          - "security"
          - "digital"

      # GoalTrackingAgent: Progress with Horizon Europe explored
      - type: "goal_progress"
        name: "horizon_europe_explored"
        min_progress: 0.15

      # PersonalizationAgent: Response should be personalized to cybersecurity
      - type: "personalization_applied"
        name: "horizon_response_personalized"
    delay_ms: 500

  # Step 4: User asks about Erasmus+ for capacity building
  - message: "What about building capacity through Erasmus+?"
    validations:
      - type: "no_error"
        name: "no_errors_step4"

      - type: "response_contains_any"
        name: "erasmus_capacity_building_explained"
        patterns:
          # Programme name patterns
          - "Erasmus+"
          - "Erasmus"
          - "E+"
          # Key Action patterns
          - "KA1"
          - "KA2"
          - "KA3"
          - "Key Action"
          - "mobility"
          - "cooperation"
          - "partnership"
          - "partnerships"
          # Capacity building patterns
          - "capacity"
          - "capacity building"
          - "build"
          - "building"
          - "develop"
          - "development"
          - "training"
          - "skills"
          - "competence"
          - "staff"
          # Higher education patterns
          - "higher education"
          - "HE"
          - "university"
          - "academic"
          - "student"
          - "students"
          - "exchange"
          # Project type patterns
          - "project"
          - "projects"
          - "strategic"
          - "cooperation"
          - "alliance"
          - "alliances"
          # Funding patterns
          - "funding"
          - "grant"
          - "budget"
          - "support"
          - "EUR"
          # Opportunity patterns
          - "option"
          - "options"
          - "opportunity"
          - "opportunities"
          - "suitable"
          - "relevant"
          - "available"
          # Recommendation patterns
          - "recommend"
          - "suggest"
          - "consider"
          - "explore"
          - "could"
          - "should"
          - "would"
          # Cybersecurity/digital context patterns
          - "cybersecurity"
          - "cyber"
          - "digital"
          - "curriculum"
          # General response patterns
          - "programme"
          - "education"
          - "European"
          - "international"
          - "network"
          - "networking"

      # GoalTrackingAgent: Progress with Erasmus+ explored
      - type: "goal_progress"
        name: "erasmus_explored"
        min_progress: 0.25

      # PersonalizationAgent: Response should be personalized
      - type: "personalization_applied"
        name: "erasmus_response_personalized"
    delay_ms: 500

  # Step 5: User asks about application sequencing
  - message: "How should we sequence our applications?"
    validations:
      - type: "no_error"
        name: "no_errors_step5"

      - type: "response_contains_any"
        name: "sequencing_advice_provided"
        patterns:
          # Sequencing patterns
          - "sequence"
          - "sequencing"
          - "order"
          - "ordering"
          - "priority"
          - "prioritize"
          - "first"
          - "second"
          - "then"
          - "next"
          - "after"
          - "before"
          - "start"
          - "begin"
          - "follow"
          # Timeline patterns
          - "year"
          - "years"
          - "timeline"
          - "time"
          - "when"
          - "phase"
          - "phased"
          - "stage"
          - "stages"
          - "step"
          - "steps"
          # Strategic patterns
          - "strategy"
          - "strategic"
          - "plan"
          - "approach"
          - "roadmap"
          - "path"
          - "pathway"
          # Building patterns
          - "build"
          - "building"
          - "develop"
          - "grow"
          - "capacity"
          - "track record"
          - "experience"
          - "foundation"
          # Programme patterns
          - "Horizon"
          - "Erasmus"
          - "programme"
          - "programmes"
          - "EU"
          # Recommendation patterns
          - "recommend"
          - "suggest"
          - "advise"
          - "consider"
          - "could"
          - "should"
          - "would"
          - "might"
          # Application patterns
          - "application"
          - "applications"
          - "apply"
          - "proposal"
          - "proposals"
          - "submit"
          - "submission"
          # Success patterns
          - "success"
          - "successful"
          - "chance"
          - "chances"
          - "likelihood"
          - "improve"

      # GoalTrackingAgent: Progress with sequencing advice
      - type: "goal_progress"
        name: "sequencing_advice_given"
        min_progress: 0.35

      # PersonalizationAgent: Sequencing should be personalized to context
      - type: "profile_used"
        name: "profile_used_for_sequencing"
        expected_fields: []

      # PersonalizationAgent: Response should be personalized
      - type: "personalization_applied"
        name: "sequencing_response_personalized"
    delay_ms: 500

  # Step 6: User asks for a realistic timeline
  - message: "What's a realistic timeline?"
    validations:
      - type: "no_error"
        name: "no_errors_step6"

      - type: "response_contains_any"
