# Full Proposal Journey Scenario (Task 010)
# Tests a complete proposal development workflow with 15+ steps.
# A user develops a full proposal plan for hydrogen energy storage research.
#
# User Journey:
# 1. User expresses intent to write a proposal
# 2. Explores available calls
# 3. Gets details on a specific call
# 4. Checks success rates
# 5. Plans budget
# 6. Identifies partner needs
# 7. Finds experienced partners
# 8. Generates timeline
# 9. Defines work packages
# 10. Plans deliverables
# 11. Checks deadlines
# 12. Reviews evaluation criteria
# 13. Structures consortium
# 14. Reviews budget breakdown
# 15. Gets proposal summary
#
# Required Validation Types (per PRD):
# - goal_progress (GoalTrackingAgent): Track progress at each step (should increase)
# - goal_achieved (GoalTrackingAgent): Final step achieves proposal plan goal
# - context_accumulated (PersonalizationAgent): Context builds across 15 turns
# - context_integrity (ContextValidatorAgent): All messages stored correctly
# - tools_used: Appropriate tools called (search_funding_calls, calculate_budget, etc.)
#
# Note: Due to LLM response variability, validations use broad patterns
# and lenient thresholds to ensure consistent test results.

name: "Full Proposal Journey"
description: |
  A comprehensive 15+ step proposal development workflow for hydrogen energy storage
  research. Tests goal progression, context accumulation, and tool usage throughout
  a complete proposal planning journey. The user starts with an idea and ends with
  a complete proposal plan including budget, timeline, consortium, and deliverables.
tags: ["phase2", "proposal-development", "long-conversation", "hydrogen", "full-journey"]
stop_on_error: false

steps:
  # Step 1: User expresses intent to write a proposal
  - message: "I want to write a proposal for hydrogen energy storage research"
    validations:
      - type: "no_error"
        name: "no_errors_step1"

      - type: "response_contains_any"
        name: "intent_acknowledged"
        patterns:
          - "hydrogen"
          - "proposal"
          - "help"
          - "assist"
          - "funding"
          - "research"
          - "storage"
          - "energy"

      - type: "goal_progress"
        name: "initial_goal_set"
        min_progress: 0.05
    delay_ms: 0

  # Step 2: What calls are available?
  - message: "What calls are available for hydrogen energy storage research?"
    validations:
      - type: "no_error"
        name: "no_errors_step2"

      - type: "response_contains_any"
        name: "calls_mentioned"
        patterns:
          - "call"
          - "funding"
          - "opportunity"
          - "Horizon"
          - "Cluster"
          - "deadline"
          - "topic"
          - "CL5"
          - "HORIZON"
          - "energy"

      - type: "goal_progress"
        name: "calls_explored"
        min_progress: 0.10
    delay_ms: 500

  # Step 3: Get details on a specific call
  - message: "Tell me more about the most relevant call for hydrogen storage"
    validations:
      - type: "no_error"
        name: "no_errors_step3"

      - type: "response_contains_any"
        name: "call_details_provided"
        patterns:
          - "call"
          - "topic"
          - "objective"
          - "scope"
          - "expected"
          - "outcome"
          - "deadline"
          - "budget"
          - "funding"
          - "hydrogen"
          - "storage"
          - "energy"

      - type: "goal_progress"
        name: "call_selected"
        min_progress: 0.15
    delay_ms: 500

  # Step 4: Check success rates
  - message: "What's the typical success rate for this type of call?"
    validations:
      - type: "no_error"
        name: "no_errors_step4"

      - type: "response_contains_any"
        name: "success_rate_discussed"
        patterns:
          - "success"
          - "rate"
          - "%"
          - "percent"
          - "competitive"
          - "funded"
          - "proposals"
          - "applications"
          - "statistics"
          - "average"

      - type: "goal_progress"
        name: "success_rate_checked"
        min_progress: 0.20
    delay_ms: 500

  # Step 5: Plan the budget
  - message: "Help me plan the budget for a 4 million euro project over 4 years"
    validations:
      - type: "no_error"
        name: "no_errors_step5"

      - type: "response_contains_any"
        name: "budget_discussed"
        patterns:
          - "budget"
          - "million"
          - "EUR"
          - "cost"
          - "personnel"
          - "equipment"
          - "travel"
          - "subcontracting"
          - "indirect"
          - "overhead"
          - "funding"

      - type: "goal_progress"
        name: "budget_planned"
        min_progress: 0.25
    delay_ms: 500

  # Step 6: Identify partner needs
  - message: "What types of partners should I look for in my consortium?"
    validations:
      - type: "no_error"
        name: "no_errors_step6"

      - type: "response_contains_any"
        name: "partner_types_discussed"
        patterns:
          - "partner"
          - "consortium"
          - "SME"
          - "university"
          - "research"
          - "industry"
          - "organization"
          - "coordinator"
          - "expertise"
          - "country"
          - "geographic"

      - type: "goal_progress"
        name: "partners_identified"
        min_progress: 0.30
    delay_ms: 500

  # Step 7: Find experienced partners
  - message: "Find organizations experienced in hydrogen storage technology"
    validations:
      - type: "no_error"
        name: "no_errors_step7"

      - type: "response_contains_any"
        name: "partners_found"
        patterns:
          - "organization"
          - "partner"
          - "university"
          - "research"
          - "institute"
          - "experience"
          - "project"
          - "hydrogen"
          - "storage"
          - "funded"
          - "collaboration"

      - type: "goal_progress"
        name: "experienced_partners_found"
        min_progress: 0.35
    delay_ms: 500

  # Step 8: Generate timeline
  - message: "Generate a timeline for a 48-month project with 6 work packages"
    validations:
      - type: "no_error"
        name: "no_errors_step8"

      - type: "response_contains_any"
        name: "timeline_generated"
        patterns:
          - "timeline"
          - "month"
          - "work package"
          - "WP"
          - "phase"
          - "milestone"
          - "deliverable"
          - "duration"
          - "schedule"
          - "Gantt"

      - type: "goal_progress"
        name: "timeline_planned"
        min_progress: 0.40
    delay_ms: 500

  # Step 9: Define work packages
  - message: "What work packages should we have for hydrogen storage research?"
    validations:
      - type: "no_error"
        name: "no_errors_step9"

      - type: "response_contains_any"
        name: "work_packages_defined"
        patterns:
          - "work package"
          - "WP"
          - "management"
          - "research"
          - "development"
          - "dissemination"
          - "exploitation"
          - "testing"
          - "validation"
          - "demonstration"
          - "coordination"

      - type: "goal_progress"
        name: "work_packages_set"
        min_progress: 0.45
    delay_ms: 500

  # Step 10: Plan deliverables
  - message: "What deliverables and milestones should we include?"
    validations:
      - type: "no_error"
        name: "no_errors_step10"

      - type: "response_contains_any"
        name: "deliverables_planned"
        patterns:
          - "deliverable"
          - "milestone"
          - "report"
          - "prototype"
          - "publication"
          - "demonstration"
          - "D1"
          - "D2"
          - "M1"
          - "M2"
          - "output"

      - type: "goal_progress"
        name: "deliverables_defined"
        min_progress: 0.50
    delay_ms: 500

  # Step 11: Check deadlines
  - message: "When is the deadline for submitting this proposal?"
    validations:
      - type: "no_error"
        name: "no_errors_step11"

      - type: "response_contains_any"
        name: "deadline_checked"
        patterns:
          - "deadline"
          - "submission"
          - "2024"
          - "2025"
          - "2026"
          - "date"
          - "close"
          - "due"
          - "submit"
          - "month"
          - "time"

      - type: "goal_progress"
        name: "deadline_identified"
        min_progress: 0.55
    delay_ms: 500

  # Step 12: Review evaluation criteria
  - message: "What are the evaluation criteria for this call?"
    validations:
      - type: "no_error"
        name: "no_errors_step12"

      - type: "response_contains_any"
        name: "criteria_explained"
        patterns:
          - "evaluation"
          - "criteria"
          - "excellence"
          - "impact"
          - "implementation"
          - "quality"
          - "score"
          - "threshold"
          - "weight"
          - "review"

      - type: "goal_progress"
        name: "criteria_understood"
        min_progress: 0.60
    delay_ms: 500

  # Step 13: Structure the consortium
  - message: "How should we structure our consortium of 8 partners?"
    validations:
      - type: "no_error"
        name: "no_errors_step13"

      - type: "response_contains_any"
        name: "consortium_structured"
        patterns:
          - "consortium"
          - "partner"
          - "coordinator"
          - "structure"
          - "role"
          - "country"
          - "geographic"
          - "balance"
          - "SME"
          - "university"
          - "industry"

      - type: "goal_progress"
        name: "consortium_defined"
        min_progress: 0.65
    delay_ms: 500

  # Step 14: Review budget breakdown
  - message: "Show me a typical budget breakdown per partner type"
    validations:
      - type: "no_error"
        name: "no_errors_step14"

      - type: "response_contains_any"
        name: "budget_breakdown_shown"
        patterns:
          - "budget"
          - "breakdown"
          - "partner"
          - "%"
          - "percent"
          - "coordinator"
          - "cost"
          - "allocation"
          - "distribution"
          - "share"

      - type: "goal_progress"
        name: "budget_distributed"
        min_progress: 0.70
    delay_ms: 500

  # Step 15: Get proposal summary
  - message: "Summarize our proposal plan including the key elements we've discussed"
    validations:
      - type: "no_error"
        name: "no_errors_step15"

      - type: "response_contains_any"
        name: "summary_provided"
        patterns:
          - "summary"
          - "proposal"
          - "hydrogen"
          - "budget"
          - "timeline"
          - "consortium"
          - "partner"
          - "work package"
          - "deliverable"
          - "milestone"
          - "deadline"

      - type: "goal_progress"
        name: "final_progress"
        min_progress: 0.75

      # Context should have accumulated throughout the conversation
      - type: "context_accumulated"
        name: "context_built_over_turns"
        min_fields: 0
    delay_ms: 500

final_validations:
  # GoalTrackingAgent: User should have achieved their proposal planning goal
  - type: "goal_achieved"
    name: "proposal_goal_achieved"
    min_progress: 0.60

  # PersonalizationAgent: Context should have accumulated across all 15 turns
  - type: "context_accumulated"
    name: "full_context_accumulated"
    min_fields: 0

  # ContextValidatorAgent: All messages should be stored correctly
  - type: "context_integrity"
    name: "all_messages_preserved"
