          - "acceptance"
          - "rate"
          - "chance"
          - "chances"
          - "odds"
          - "likelihood"
          - "probability"
          - "%"
          - "percent"
          # Low success indicators
          - "low"
          - "small"
          - "limited"
          - "selective"
          - "highly"
          # Application patterns
          - "application"
          - "applications"
          - "apply"
          - "applying"
          - "proposal"
          - "proposals"
          # Evaluation patterns
          - "evaluation"
          - "evaluate"
          - "review"
          - "assess"
          - "assessment"
          - "criteria"
          - "criterion"
          # Time/resource patterns
          - "time"
          - "effort"
          - "resource"
          - "resources"
          - "invest"
          - "investment"
          - "cost"
          - "costs"
          # Rejection patterns
          - "reject"
          - "rejection"
          - "fail"
          - "failure"
          - "unsuccessful"
          - "not funded"
          # Process patterns
          - "process"
          - "stage"
          - "stages"
          - "step"
          - "steps"
          - "phase"
          - "phases"
          - "interview"
          # Funding patterns
          - "fund"
          - "funding"
          - "grant"
          - "equity"
          - "blended"
          - "finance"

      # GoalTrackingAgent: Initial progress
      - type: "goal_progress"
        name: "risk_understanding_initiated"
        min_progress: 0.05

      # PersonalizationAgent: Context should start building
      - type: "context_accumulated"
