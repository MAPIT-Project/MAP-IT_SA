# Risk Assessment Scenario (Task 025)
# Tests the system's ability to discuss risks associated with EIC Accelerator
# applications and provide mitigation strategies. A user asks about the
# various risks and challenges of applying to EIC Accelerator, considering
# factors like prior funding, company size, and the interview stage.
#
# User Journey:
# 1. User asks about risks of applying to EIC Accelerator
# 2. User asks what happens if they don't have prior EU funding
# 3. User asks how company size affects chances
# 4. User asks about the interview stage
# 5. User asks what they can do to improve their odds
#
# Required Validation Types (per PRD):
# - context_accumulated (PersonalizationAgent): User context builds across turns
# - profile_used (PersonalizationAgent): Context influences recommendations
# - personalization_applied (PersonalizationAgent): Responses tailored to user
# - goal_progress (GoalTrackingAgent): Progress toward understanding risks
# - goal_achieved (GoalTrackingAgent): User understands risks and mitigations
# - context_integrity (ContextValidatorAgent): All messages stored correctly
# - response_contains_any (Built-in): Pattern matching for risk content
# - no_error (Built-in): Error detection
#
# Key Test: System should accurately identify risks associated with EIC
# Accelerator, explain factors affecting success, and provide actionable
# mitigation strategies.
# Note: Due to LLM response variability, validations use broad patterns
# and lenient thresholds to ensure consistent test results.

name: "Risk Assessment"
description: |
  A 5-step risk assessment workflow where a user explores the risks and
  challenges of applying to EIC Accelerator. Tests the system's ability
  to identify risks accurately, explain how factors like prior funding
  and company size affect success, discuss the interview stage, and
  provide actionable mitigation strategies. The conversation builds
  user context progressively and validates that advice is appropriately
  risk-aware and practical.
tags: ["phase5", "strategic-planning", "risk-assessment", "eic", "accelerator", "mitigation"]
stop_on_error: false

steps:
  # Step 1: User asks about risks of applying to EIC Accelerator
  - message: "What are the risks of applying to EIC Accelerator?"
