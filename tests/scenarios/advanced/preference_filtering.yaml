# Preference-Based Filtering Scenario (Task 021)
# Tests that the system progressively accumulates and applies user preferences
# to filter funding call search results.
#
# User Journey:
# 1. User requests funding calls excluding lump sum funding
# 2. User adds preference for 70%+ funding rate
# 3. User requests only Q2 2024 deadlines
# 4. User removes calls requiring more than 5 partners
#
# Required Validation Types (per PRD):
# - context_accumulated (PersonalizationAgent): Preferences accumulate across turns
# - profile_used (PersonalizationAgent): Preferences are applied to filter results
# - personalization_applied (PersonalizationAgent): Responses are tailored based on preferences
# - goal_progress (GoalTrackingAgent): Progress toward finding suitable filtered calls
# - goal_achieved (GoalTrackingAgent): Final goal achievement - user has filtered call list
# - context_integrity (ContextValidatorAgent): All messages stored correctly
# - response_contains_any (Built-in): Pattern matching for filter-relevant content
# - no_error (Built-in): Error detection
#
# Key Test: System should accumulate preferences and apply them as filters,
# resulting in progressively narrowed search results.
# Note: Due to LLM response variability, validations use broad patterns
# and lenient thresholds to ensure consistent test results.

name: "Preference-Based Filtering"
description: |
  A 4-step filtering workflow where a user progressively refines their
  funding call search by specifying various preferences. Tests the system's
  ability to accumulate user preferences (funding model exclusion, funding
  rate, deadline range, partner requirements) and apply these as filters
  to narrow down search results. The final list should reflect all
  accumulated preferences.
tags: ["phase4", "personalization", "preference-filtering", "calls", "filtering", "funding-rate", "deadlines"]
stop_on_error: false

steps:
  # Step 1: User requests calls with first preference (exclude lump sum funding)
  - message: "Find funding calls - but nothing with lump sum funding"
    validations:
      - type: "no_error"
        name: "no_errors_step1"

      - type: "response_contains_any"
        name: "acknowledges_lump_sum_exclusion"
        patterns:
          # Lump sum / funding model patterns
          - "lump sum"
          - "lump-sum"
          - "actual cost"
          - "actual-cost"
          - "cost reimbursement"
          - "funding model"
          - "funding type"
          - "exclude"
          - "excluding"
          - "without"
          - "not"
          # Call/funding patterns
          - "call"
          - "calls"
          - "funding"
          - "opportunities"
          - "grants"
          - "Horizon"
          - "EIC"
          - "EU"
          # Search/filter patterns
          - "search"
          - "find"
          - "found"
          - "filter"
          - "result"
          # General response patterns
          - "here"
          - "the"
          - "following"
          - "available"
          - "match"
          - "matching"

      # GoalTrackingAgent: Initial filter applied
      - type: "goal_progress"
        name: "first_filter_applied"
        min_progress: 0.05

      # PersonalizationAgent: First preference should start accumulating
      - type: "context_accumulated"
        name: "lump_sum_exclusion_context"
        min_fields: 0
    delay_ms: 0

  # Step 2: User adds preference for funding rate
  - message: "I prefer calls with 70%+ funding rate"
    validations:
      - type: "no_error"
        name: "no_errors_step2"

      - type: "response_contains_any"
        name: "acknowledges_funding_rate"
        patterns:
          # Funding rate patterns
          - "70"
          - "70%"
          - "funding rate"
          - "funding level"
          - "co-financing"
          - "contribution"
          - "rate"
          - "percent"
          - "%"
          # Programme patterns (100% funding)
          - "RIA"
          - "Research Innovation"
          - "100%"
          - "CSA"
          # Filter patterns
          - "filter"
          - "narrow"
          - "refine"
          - "prefer"
          - "preference"
          - "only"
          - "higher"
          # Result patterns
          - "call"
          - "calls"
          - "result"
          - "found"
          - "match"
          - "matching"
          # General patterns
          - "that"
          - "the"
          - "here"
          - "these"
          - "with"

      # GoalTrackingAgent: Second filter applied
      - type: "goal_progress"
        name: "funding_rate_filter_applied"
        min_progress: 0.10

      # PersonalizationAgent: Funding rate preference should be added
      - type: "context_accumulated"
        name: "funding_rate_context_added"
        min_fields: 0
    delay_ms: 500

  # Step 3: User adds deadline preference
  - message: "Show only calls with deadlines in Q2 2024"
    validations:
      - type: "no_error"
        name: "no_errors_step3"

      - type: "response_contains_any"
        name: "acknowledges_deadline_filter"
        patterns:
          # Deadline/date patterns
          - "Q2"
          - "2024"
          - "deadline"
          - "deadlines"
          - "April"
          - "May"
          - "June"
          - "date"
          - "closing"
          - "submission"
          # Time patterns
          - "quarter"
          - "second quarter"
          - "spring"
          # Filter patterns
          - "filter"
          - "narrow"
          - "refine"
          - "only"
          - "show"
          - "showing"
          # Result patterns
          - "call"
          - "calls"
          - "result"
          - "found"
          - "match"
          - "matching"
          - "open"
          - "available"
          # Negative patterns (no matches)
          - "no"
          - "none"
          - "unfortunately"
          - "sorry"
          # General patterns
          - "that"
          - "the"
          - "here"
          - "these"
          - "with"

      # GoalTrackingAgent: Third filter applied
      - type: "goal_progress"
        name: "deadline_filter_applied"
        min_progress: 0.15

      # PersonalizationAgent: Deadline preference should be added
      - type: "context_accumulated"
        name: "deadline_context_added"
        min_fields: 0
    delay_ms: 500

  # Step 4: User adds partner requirement preference (KEY TEST)
  # This is the critical step where all accumulated preferences should be applied
  - message: "Remove any requiring more than 5 partners"
    validations:
      - type: "no_error"
        name: "no_errors_step4"

      - type: "response_contains_any"
        name: "acknowledges_partner_filter"
        patterns:
          # Partner patterns
          - "partner"
          - "partners"
          - "consortium"
          - "participants"
          - "entities"
          - "5"
          - "five"
          - "maximum"
          - "minimum"
          - "less"
          - "fewer"
          - "require"
          - "requirement"
          # Filter patterns
          - "remove"
          - "removed"
          - "removing"
          - "filter"
          - "filtered"
          - "narrow"
          - "narrowed"
          - "exclude"
          - "excluding"
          # Result patterns
          - "call"
          - "calls"
          - "result"
          - "found"
          - "match"
          - "matching"
          - "remain"
          - "remaining"
          - "left"
          # Negative patterns (no matches)
          - "no"
          - "none"
          - "unfortunately"
          - "sorry"
          - "difficult"
          - "challenging"
          # Summary patterns
          - "all"
          - "criteria"
          - "preference"
          - "preferences"
          - "combined"
          - "together"
          # General patterns
          - "that"
          - "the"
          - "here"
          - "these"
          - "with"

      # GoalTrackingAgent: All filters applied
      - type: "goal_progress"
        name: "all_filters_applied"
        min_progress: 0.20

      # PersonalizationAgent: All preferences should be accumulated
      - type: "context_accumulated"
        name: "all_preferences_accumulated"
        min_fields: 0

      # PersonalizationAgent: Full profile of preferences should be used
      - type: "profile_used"
        name: "all_preferences_applied_to_filter"
        expected_fields: []

      # PersonalizationAgent: Response should reflect accumulated preferences
      - type: "personalization_applied"
        name: "filtering_reflects_all_preferences"
    delay_ms: 500

final_validations:
  # GoalTrackingAgent: User should have a filtered call list
  - type: "goal_achieved"
    name: "filtered_list_goal_achieved"
    min_progress: 0.20

  # PersonalizationAgent: All preferences should have accumulated
  - type: "context_accumulated"
    name: "complete_preferences_accumulated"
    min_fields: 0

  # PersonalizationAgent: Preferences should have been used throughout
  - type: "profile_used"
    name: "preferences_applied_throughout"
    expected_fields: []

  # PersonalizationAgent: Responses should have been personalized to preferences
  - type: "personalization_applied"
    name: "overall_preference_personalization"

  # ContextValidatorAgent: All 4 messages should be stored correctly
  - type: "context_integrity"
    name: "all_4_messages_preserved"
