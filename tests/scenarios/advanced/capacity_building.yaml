# Capacity Building Scenario (Task 024)
# Tests beginner-friendly onboarding for organizations new to EU funding.
# A user who has never received EU funding before seeks guidance on how
# to get started, which programmes are best for beginners, whether to
# start as partner or coordinator, appropriate project sizes, and how
# to build a track record.
#
# User Journey:
# 1. User reveals they are new to EU funding and asks how to get started
# 2. User asks which programmes are best for beginners
# 3. User asks whether to start as partner or coordinator
# 4. User asks about appropriate first project size
# 5. User asks how to build track record for future success
#
# Required Validation Types (per PRD):
# - context_accumulated (PersonalizationAgent): User context builds across turns
# - profile_used (PersonalizationAgent): Context influences recommendations
# - personalization_applied (PersonalizationAgent): Responses tailored to user
# - goal_progress (GoalTrackingAgent): Progress toward getting started
# - goal_achieved (GoalTrackingAgent): User has a clear path forward
# - context_integrity (ContextValidatorAgent): All messages stored correctly
# - response_contains_any (Built-in): Pattern matching for onboarding content
# - no_error (Built-in): Error detection
#
# Key Test: System should provide beginner-appropriate advice with a clear
# progression path from newcomer to experienced participant.
# Note: Due to LLM response variability, validations use broad patterns
# and lenient thresholds to ensure consistent test results.

name: "Capacity Building"
description: |
  A 5-step onboarding workflow where an organization new to EU funding
  seeks help understanding how to get started. Tests the system's ability
  to provide beginner-appropriate advice, recommend suitable programmes,
  guide on partner vs coordinator roles, suggest appropriate project sizes,
  and outline a track record building strategy. The conversation builds
  user context progressively (newcomer status) and validates that
  recommendations are appropriately conservative for beginners.
tags: ["phase5", "strategic-planning", "capacity-building", "beginner", "onboarding", "track-record"]
stop_on_error: false

