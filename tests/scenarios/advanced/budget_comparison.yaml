          - "year"
          - "years"
          - "annual"
          - "yearly"
          # Direction patterns
          - "increase"
          - "increased"
          - "increasing"
          - "decrease"
          - "decreased"
          - "decreasing"
          - "grow"
          - "growth"
          - "growing"
          - "grew"
          - "decline"
          - "declining"
          - "stable"
          - "steady"
          - "flat"
          - "constant"
          - "fluctuat"
          # Magnitude patterns
          - "higher"
          - "lower"
          - "more"
          - "less"
          - "larger"
          - "smaller"
          - "%"
          - "percent"
          - "percentage"
          # Budget/funding patterns
          - "budget"
          - "budgets"
          - "funding"
          - "cost"
          - "costs"
          - "EUR"
          - "euro"
          - "million"
          - "billion"
          # Period patterns
          - "period"
          - "timeframe"
          - "framework"
          - "Horizon Europe"
          - "HE"
          - "programme"
          - "program"
          # Data patterns
          - "data"
          - "statistics"
          - "analysis"
          - "pattern"
          - "patterns"
          - "historical"
          - "history"
          - "average"
          - "median"

      # CrossProgrammeAgent: Budget trends should be accurate
      - type: "programme_accurate"  # CrossProgrammeAgent
        name: "budget_trends_accurate"
        programme: "horizon_europe"
        min_score: 0.5

      # GoalTrackingAgent: Full budget analysis should be complete
      - type: "goal_progress"
        name: "budget_trends_complete"
        min_progress: 0.35

      # PersonalizationAgent: Full context should be accumulated
      - type: "context_accumulated"
        name: "full_budget_context"
        min_fields: 0

      # PersonalizationAgent: Response should use accumulated profile
      - type: "profile_used"
        name: "profile_used_for_trends"
        expected_fields: []

      # PersonalizationAgent: Response should be personalized
      - type: "personalization_applied"
        name: "trends_response_personalized"
    delay_ms: 500

final_validations:
  # GoalTrackingAgent: User should understand budget comparisons
  - type: "goal_achieved"
    name: "budget_comparison_goal_achieved"
    min_progress: 0.40

  # PersonalizationAgent: Full profile should have accumulated
  - type: "context_accumulated"
    name: "complete_context_accumulated"
    min_fields: 0

  # ContextValidatorAgent: All 5 messages should be stored correctly
  - type: "context_integrity"
    name: "all_5_messages_preserved"
