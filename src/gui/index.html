<!DOCTYPE html>
<html>
<head>
    <title>MAP-IT Chat</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        #chatbox {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
        }
        .user-message {
            background-color: #eee;
            text-align: right;
        }
        .bot-message {
            background-color: #ccf;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MAP-IT Chat</h1>
        <div id="chatbox">
            </div>
        <div class="input-group mb-3">
            <input type="text" id="user_input" class="form-control" placeholder="Type your question...">
            <div class="input-group-append">
                <button id="send_button" class="btn btn-primary" type="button">Send</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#send_button").click(sendMessage);
            $('#user_input').keypress(function(e) {
                if (e.which == 13) { //enter
                    sendMessage();
                }
            });
        });

        function sendMessage() {
            var user_message = $("#user_input").val();
            $("#user_input").val('');
            displayMessage(user_message, 'user');

            $.ajax({
                url: '/get_response',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ "prompt": user_message }),
                success: function(response) {
                    displayMessage(response.response, 'bot');
                },
                error: function(error) {
                    console.error("Error:", error);
                    displayMessage("Sorry, there was an error processing your request.", 'bot');
                }
            });
        }

        function displayMessage(message, sender) {
            var message_element = $("<div>").addClass("message").addClass(sender + "-message").text(message);
            $("#chatbox").append(message_element);
            $("#chatbox").scrollTop($("#chatbox")[0].scrollHeight);
        }
    </script>
</body>
</html>
