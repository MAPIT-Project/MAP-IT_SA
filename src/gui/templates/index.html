<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAP_IT</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css"> <!-- Optional: For any additional styles -->
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="container chat-container bg-white rounded shadow-lg">
        <div class="chat-header bg-primary text-white text-center py-3 rounded-top">
            <h2 class="mb-0">MAP_IT Chat Interface</h2>
        </div>
        <div id="chat-box" class="chat-box flex-grow-1 overflow-auto p-3"></div>
        <div class="chat-input-container d-flex border-top p-3">
            <textarea id="chat-input" class="form-control flex-grow-1 me-2" placeholder="Type your query here..." rows="1"></textarea>
            <button id="send-btn" class="btn btn-primary">Send</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
