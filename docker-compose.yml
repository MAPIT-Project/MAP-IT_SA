services:
  # Redis service for Celery message broker and result backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - USE_LOCAL_DB=true
      - DOCKER_ENV=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_AI_PROVIDER=gemini
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-x-ai/grok-4-fast:free}
      # Enhanced RAG Configuration
      - GOOGLE_EMBEDDING_API_KEY=${GOOGLE_EMBEDDING_API_KEY:-}
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - USE_SUPABASE=true
      - VECTOR_SEARCH_ENABLED=false
      - EMBEDDING_MODEL=models/text-embedding-004
      - EMBEDDING_DIMENSION=768
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - MAX_CHUNKS_PER_QUERY=5
      - SIMILARITY_THRESHOLD=0.7
      - MAX_FILE_SIZE_MB=50
      - UPLOAD_DIR=uploads
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery worker for regular RAG queries
  celery-worker:
    build: .
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - USE_LOCAL_DB=true
      - DOCKER_ENV=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_AI_PROVIDER=gemini
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-x-ai/grok-4-fast:free}
      # Enhanced RAG Configuration
      - GOOGLE_EMBEDDING_API_KEY=${GOOGLE_EMBEDDING_API_KEY:-}
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - USE_SUPABASE=true
      - VECTOR_SEARCH_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.services.celery_app.celery_app worker --loglevel=info --concurrency=4 --queues=rag_queries
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Celery worker for streaming RAG queries  
  celery-worker-stream:
    build: .
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - USE_LOCAL_DB=true
      - DOCKER_ENV=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_AI_PROVIDER=gemini
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-x-ai/grok-4-fast:free}
      # Enhanced RAG Configuration
      - GOOGLE_EMBEDDING_API_KEY=${GOOGLE_EMBEDDING_API_KEY:-}
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - USE_SUPABASE=true
      - VECTOR_SEARCH_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.services.celery_app.celery_app worker --loglevel=info --concurrency=2 --queues=rag_streams
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:

networks:
  celery_network:
    driver: bridge 