services:
  flask_app:
    build:
      context: ./src/gui  # Context points to your Flask app folder
      dockerfile: Dockerfile  # Dockerfile in the specified context
    ports:
      - "5000:5000"  # Maps Flask app to port 5000 on the host
    environment:
      DGRAPH_HOST: dgraph:9080  # Refers to the Dgraph service
    # depends_on:
    #   - dgraph  # Ensure dgraph starts before flask_app
    volumes:
      - ./src:/app/src  # Mount the entire src folder