version: '3.8'

services:
  cordis-rag-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env
    environment:
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-openai}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-preview-05-20}
    restart: unless-stopped
