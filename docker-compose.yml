services:
  # Redis service for Celery message broker and result backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mapit_network

  # FastAPI application
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - USE_LOCAL_DB=true
      - DOCKER_ENV=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_AI_PROVIDER=gemini
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-x-ai/grok-4-fast:free}
      # Enhanced RAG Configuration
      - GOOGLE_EMBEDDING_API_KEY=${GOOGLE_EMBEDDING_API_KEY:-}
      - SUPABASE_URL=http://host.docker.internal:54321
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - USE_SUPABASE=true
      - VECTOR_SEARCH_ENABLED=false
      - EMBEDDING_MODEL=models/text-embedding-004
      - EMBEDDING_DIMENSION=768
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - MAX_CHUNKS_PER_QUERY=5
      - SIMILARITY_THRESHOLD=0.7
      - MAX_FILE_SIZE_MB=50
      - UPLOAD_DIR=uploads
      # Neo4j Configuration (use Docker service name)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mapit_secure_password_2024}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mapit_network

  # Neo4j Graph Database for relationship-aware queries
  neo4j:
    image: neo4j:5.15.0-community
    container_name: mapit-neo4j
    ports:
      - "7475:7474"  # HTTP Browser (host 7475 -> container 7474 to avoid conflict)
      - "7688:7687"  # Bolt Protocol (host 7688 -> container 7687 to avoid conflict)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mapit_secure_password_2024}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ./neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - mapit_network

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:

networks:
  mapit_network:
    driver: bridge
