services:
  # Redis service for Celery message broker and result backend
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"  # High port to avoid conflict with other deployment
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mapit_network

  # FastAPI application
  api:
    build: .
    ports:
      - "18000:8000"  # High port to avoid conflict with other deployment
    env_file:
      - .env
    environment:
      # Redis Configuration (Docker-specific, uses service name)
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # Database Configuration (Docker-specific, uses service name)
      - DATABASE_URL=postgresql://postgres:postgres@supabase_db_supabase_cli:5432/postgres

      # Docker Environment
      - DOCKER_ENV=true

      # AI Provider Configuration (respects .env or uses defaults)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - GEMINI_PRO_MODEL=${GEMINI_PRO_MODEL:-gemini-3.1-pro-preview}
      - SMART_MODEL_ROUTING=${SMART_MODEL_ROUTING:-true}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-x-ai/grok-4-fast:free}

      # Enhanced RAG Configuration
      - GOOGLE_EMBEDDING_API_KEY=${GOOGLE_EMBEDDING_API_KEY:-}

      # Supabase Configuration (Docker-specific, uses service name)
      - SUPABASE_URL=http://supabase_kong_supabase_cli:8000
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}

      # Vector Search Configuration (respects .env or uses defaults)
      - VECTOR_SEARCH_ENABLED=${VECTOR_SEARCH_ENABLED:-true}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-models/gemini-embedding-001}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-3072}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-300}
      - MAX_CHUNKS_PER_QUERY=${MAX_CHUNKS_PER_QUERY:-20}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.45}

      # Document Processing (respects .env or uses default)
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - UPLOAD_DIR=${UPLOAD_DIR:-uploads}

      # Neo4j Configuration (Docker-specific, uses service name)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mapit_secure_password_2024}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mapit_network
      - supabase_network

  # Neo4j Graph Database for relationship-aware queries
  neo4j:
    image: neo4j:5.22.0-community
    container_name: mapit-neo4j
    ports:
      - "17474:7474"  # HTTP Browser (high port to avoid conflict with other Neo4j)
      - "17687:7687"  # Bolt Protocol (high port to avoid conflict with other Neo4j)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mapit_secure_password_2024}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ./neo4j/import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - mapit_network

# =========================================================================
# Standalone Local Database (Optional fallback for dev without Supabase CLI)
# =========================================================================
# To run standalone PostgreSQL without running the Supabase CLI, uncomment
# the service block below, and use it instead of supabase_db_supabase_cli.
#
#   postgres:
#     image: pgvector/pgvector:pg16
#     container_name: mapit-postgres
#     ports:
#       - "5432:5432"
#     environment:
#       POSTGRES_USER: postgres
#       POSTGRES_PASSWORD: postgres_secure_password
#       POSTGRES_DB: postgres
#     volumes:
#       - postgres_data:/var/lib/postgresql/data
#     healthcheck:
#       test: ["CMD-SHELL", "pg_isready -U postgres"]
#       interval: 10s
#       timeout: 5s
#       retries: 5
#     networks:
#       - mapit_network

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  # Uncomment if using standalone database:
  # postgres_data:

networks:
  mapit_network:
    driver: bridge

  # External Supabase CLI network.
  # Note: If docker-compose up fails with network not found, run:
  # docker network create supabase_network_supabase_cli
  # Or change "external: true" to "external: false" for a standalone bridge network.
  supabase_network:
    external: true
    name: supabase_network_supabase_cli
