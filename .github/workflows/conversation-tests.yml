# GitHub Actions Workflow for MAPIT Conversation Stability Tests
#
# This workflow runs comprehensive conversation scenario tests to ensure:
# 1. No race conditions in concurrent message handling
# 2. Context integrity across DB and Redis
# 3. Quality maintenance (>= 75/100 threshold)
# 4. Regression tests for critical infrastructure fixes
# 5. Advanced conversation flows (multi-programme, personalization, goal tracking)
# 6. Goal achievement validation
# 7. Cross-programme accuracy validation
#
# Triggered on:
# - Push to main branch (for core conversation files)
# - Pull requests (any branch)
# - Manual workflow dispatch

name: Conversation Tests

on:
  push:
    branches: [main]
    paths:
      - 'app/services/conversation/**'
      - 'app/services/memory/**'
      - 'app/services/agents/**'
      - 'app/core/conversation_lock.py'
      - 'app/core/atomic_storage.py'
      - 'tests/test_conversation*.py'
      - 'tests/agents/**'
      - 'tests/scenarios/**'
      - '.github/workflows/conversation-tests.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: 'Run live API tests (requires services)'
        required: false
        default: 'true'
        type: boolean
      test_category:
        description: 'Test category to run (all, basic, follow_up, context, concurrent, advanced)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - basic
          - follow_up
          - context
          - concurrent
          - regression
          - advanced
          - programme
          - personalization
          - eligibility

env:
  PYTHON_VERSION: '3.11'
  # Database configuration
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mapit_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: mapit_test
  # Redis configuration
  REDIS_URL: redis://localhost:6379/0
  # Neo4j configuration
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: testpassword123
  # API configuration
  TEST_API_URL: http://localhost:8000
  # Quality threshold
  QUALITY_THRESHOLD: 75
  # Advanced scenario thresholds
  GOAL_ACHIEVEMENT_THRESHOLD: 0.7
  PERSONALIZATION_MIN_FIELDS: 2
  CROSS_PROGRAMME_ACCURACY_THRESHOLD: 0.7

jobs:
  # =============================================================================
  # Job 1: Unit Tests (No Services Required)
  # =============================================================================
  unit-tests:
    name: Unit Tests (No Services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-asyncio aiohttp asyncpg

      - name: Run regression tests (no services)
        run: |
          pytest tests/test_conversation_regression.py -v \
            --tb=short \
            -x \
            --ignore=tests/test_conversation_scenarios.py \
            --ignore=tests/test_conversation_scenarios_live.py

      - name: Run conversation lock tests
        run: |
          pytest tests/test_conversation_lock.py -v --tb=short -x || true

  # =============================================================================
  # Job 2: Integration Tests with Services
  # =============================================================================
  integration-tests:
    name: Integration Tests (With Services)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event.inputs.run_live_tests != 'false'

    services:
      # PostgreSQL service container
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mapit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service container
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Neo4j service container
      neo4j:
        image: neo4j:5.15.0-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-asyncio aiohttp asyncpg redis

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

          echo "Waiting for Redis..."
          until redis-cli -h localhost ping; do
            sleep 2
          done

          echo "Waiting for Neo4j..."
          for i in {1..30}; do
            if curl -s http://localhost:7474 > /dev/null; then
              echo "Neo4j is ready"
              break
            fi
            echo "Waiting for Neo4j... attempt $i"
            sleep 5
          done

      - name: Initialize test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mapit_test -c "
            CREATE TABLE IF NOT EXISTS conversation_messages (
              id SERIAL PRIMARY KEY,
              conversation_id VARCHAR(255) NOT NULL,
              role VARCHAR(50) NOT NULL,
              content TEXT NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              metadata JSONB DEFAULT '{}'
            );
            CREATE INDEX IF NOT EXISTS idx_conv_id ON conversation_messages(conversation_id);
          "

      - name: Start API server
        run: |
          # Create minimal .env for testing
          cat > .env << EOF
          DATABASE_URL=${{ env.DATABASE_URL }}
          REDIS_URL=${{ env.REDIS_URL }}
          NEO4J_URI=${{ env.NEO4J_URI }}
          NEO4J_USER=${{ env.NEO4J_USER }}
          NEO4J_PASSWORD=${{ env.NEO4J_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'test-key' }}
          DEFAULT_AI_PROVIDER=gemini
          EOF

          # Start API server in background
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &

          # Wait for API to be ready
          echo "Waiting for API server..."
          for i in {1..60}; do
            if curl -s http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "API server is ready"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "API server failed to start"
              cat api.log
              exit 1
            fi
            sleep 2
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run scenario tests
        id: scenario_tests
        run: |
          TEST_FILTER=""
          if [ "${{ github.event.inputs.test_category }}" != "all" ] && [ -n "${{ github.event.inputs.test_category }}" ]; then
            TEST_FILTER="-k ${{ github.event.inputs.test_category }}"
          fi

          pytest tests/test_conversation_scenarios.py -v \
            --tb=short \
            $TEST_FILTER \
            --junitxml=test-results/scenario-tests.xml \
            --cov=app/services/conversation \
            --cov-report=xml:coverage/conversation-coverage.xml \
            --cov-report=html:coverage/html \
            || echo "scenario_tests_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run context validation tests
        if: github.event.inputs.test_category == 'all' || github.event.inputs.test_category == 'context'
        run: |
          pytest tests/test_conversation_scenarios.py::TestContextValidation -v \
            --tb=short \
            --junitxml=test-results/context-tests.xml \
            || true
        continue-on-error: true

      - name: Check API logs on failure
        if: failure()
        run: |
          echo "=== API Server Logs ==="
          cat api.log || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            coverage/
            api.log
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/conversation-coverage.xml
          flags: conversation-tests
          name: conversation-coverage
          fail_ci_if_error: false

  # =============================================================================
  # Job 3: Quality Validation
  # =============================================================================
  quality-validation:
    name: Quality Validation
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always() && needs.integration-tests.result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check quality baseline
        id: quality_check
        run: |
          # Check if quality baseline exists and validate
          BASELINE_FILE="tests/quality/results/conversation_quality_baseline.json"

          if [ -f "$BASELINE_FILE" ]; then
            echo "Quality baseline found, validating..."
            python -c "
          import json
          import sys

          with open('$BASELINE_FILE', 'r') as f:
              baseline = json.load(f)

          # Check overall average
          avg_score = baseline.get('overall_average', 0)
          threshold = ${{ env.QUALITY_THRESHOLD }}

          print(f'Quality baseline average: {avg_score}')
          print(f'Quality threshold: {threshold}')

          if avg_score < threshold:
              print(f'FAIL: Quality below threshold ({avg_score} < {threshold})')
              sys.exit(1)
          else:
              print(f'PASS: Quality meets threshold ({avg_score} >= {threshold})')
          "
          else
            echo "No quality baseline found - skipping baseline comparison"
            echo "Consider running quality baseline measurement (Task 022)"
          fi

      - name: Generate quality report
        if: always()
        run: |
          mkdir -p quality-reports

          cat > quality-reports/summary.md << 'EOF'
          # Conversation Quality Report

          ## Test Run Summary
          - **Workflow Run**: ${{ github.run_number }}
          - **Branch**: ${{ github.ref_name }}
          - **Commit**: ${{ github.sha }}
          - **Quality Threshold**: ${{ env.QUALITY_THRESHOLD }}

          ## Quality Gates
          - [ ] All scenario tests pass
          - [ ] Quality score >= ${{ env.QUALITY_THRESHOLD }}
          - [ ] No race conditions detected
          - [ ] Context integrity maintained

          ## Artifacts
          - Test results: `test-results/`
          - Coverage report: `coverage/html/`
          EOF

          echo "Quality report generated"

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: quality-reports/
          retention-days: 30

  # =============================================================================
  # Job 4: Race Condition Detection (Concurrent Tests)
  # =============================================================================
  race-condition-tests:
    name: Race Condition Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event.inputs.test_category == 'all' || github.event.inputs.test_category == 'concurrent' || github.event.inputs.test_category == ''

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mapit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-asyncio asyncpg redis

      - name: Run concurrent access regression tests
        run: |
          # Run the critical race condition prevention tests
          pytest tests/test_conversation_regression.py::TestTask001RaceConditionPrevention -v \
            --tb=short \
            --junitxml=test-results/race-condition-tests.xml

      - name: Upload race condition test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-condition-results
          path: test-results/
          retention-days: 30

  # =============================================================================
  # Job 5: Advanced Conversation Scenario Tests
  # =============================================================================
  advanced-scenario-tests:
    name: Advanced Scenario Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event.inputs.test_category == 'all' || github.event.inputs.test_category == 'advanced' || github.event.inputs.test_category == 'programme' || github.event.inputs.test_category == 'personalization' || github.event.inputs.test_category == 'eligibility' || github.event.inputs.test_category == ''

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mapit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.15.0-community
        env:
          NEO4J_AUTH: neo4j/testpassword123
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-asyncio aiohttp asyncpg redis pyyaml

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

          echo "Waiting for Redis..."
          until redis-cli -h localhost ping; do
            sleep 2
          done

          echo "Waiting for Neo4j..."
          for i in {1..30}; do
            if curl -s http://localhost:7474 > /dev/null; then
              echo "Neo4j is ready"
              break
            fi
            echo "Waiting for Neo4j... attempt $i"
            sleep 5
          done

      - name: Run advanced scenario regression tests
        id: advanced_regression
        run: |
          # Run advanced conversation flow regression tests
          pytest tests/test_advanced_conversation_regression.py -v \
            --tb=short \
            --junitxml=test-results/advanced-regression-tests.xml \
            || echo "advanced_regression_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run advanced scenario tests by category
        id: advanced_scenarios
        run: |
          TEST_FILTER=""
          if [ "${{ github.event.inputs.test_category }}" == "programme" ]; then
            TEST_FILTER="-k 'programme or phase1 or phase6'"
          elif [ "${{ github.event.inputs.test_category }}" == "personalization" ]; then
            TEST_FILTER="-k 'personalization or profile or context or phase4'"
          elif [ "${{ github.event.inputs.test_category }}" == "eligibility" ]; then
            TEST_FILTER="-k 'eligibility or phase8'"
          fi

          # Run advanced conversation scenario tests
          pytest tests/test_advanced_conversation_scenarios.py -v \
            --tb=short \
            $TEST_FILTER \
            --junitxml=test-results/advanced-scenario-tests.xml \
            --cov=app/services/agents \
            --cov-report=xml:coverage/advanced-coverage.xml \
            || echo "advanced_scenarios_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Validate goal achievement metrics
        id: goal_metrics
        run: |
          # Check goal tracking agent functionality
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tests.agents import GoalTrackingAgent

          agent = GoalTrackingAgent(use_llm=False)
          print('GoalTrackingAgent instantiated successfully')

          # Verify methods exist
          assert hasattr(agent, 'evaluate_progress'), 'Missing evaluate_progress method'
          assert hasattr(agent, 'check_completion'), 'Missing check_completion method'
          assert hasattr(agent, 'validate_goal_progress'), 'Missing validate_goal_progress method'
          assert hasattr(agent, 'validate_goal_achieved'), 'Missing validate_goal_achieved method'
          print('Goal achievement metrics validation: PASSED')
          "

      - name: Validate personalization quality checks
        id: personalization_metrics
        run: |
          # Check personalization agent functionality
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tests.agents import PersonalizationAgent

          agent = PersonalizationAgent(use_llm=False)
          print('PersonalizationAgent instantiated successfully')

          # Verify methods exist
          assert hasattr(agent, 'add_turn'), 'Missing add_turn method'
          assert hasattr(agent, 'get_profile'), 'Missing get_profile method'
          assert hasattr(agent, 'validate_context_accumulation'), 'Missing validate_context_accumulation'
          assert hasattr(agent, 'validate_profile_usage'), 'Missing validate_profile_usage method'
          assert hasattr(agent, 'validate_personalization'), 'Missing validate_personalization method'

          # Basic functionality test
          agent.add_turn('I am from Germany', 'As a German organization, you have full access.')
          profile = agent.get_profile()
          assert profile is not None, 'Profile should not be None'
          print('Personalization quality checks validation: PASSED')
          "

      - name: Validate cross-programme accuracy
        id: cross_programme_metrics
        run: |
          # Check cross-programme agent functionality
          python -c "
          import sys
          sys.path.insert(0, '.')
          from tests.agents import CrossProgrammeAgent

          agent = CrossProgrammeAgent(use_llm=False)
          print('CrossProgrammeAgent instantiated successfully')

          # Verify methods exist
          assert hasattr(agent, 'check_programme_mentions'), 'Missing check_programme_mentions'
          assert hasattr(agent, 'validate_programme_facts'), 'Missing validate_programme_facts'
          assert hasattr(agent, 'validate_eligibility_rules'), 'Missing validate_eligibility_rules'
          assert hasattr(agent, 'validate_programme_mentioned'), 'Missing validate_programme_mentioned'

          # Basic functionality test
          result = agent.check_programme_mentions('Horizon Europe and Erasmus+ are EU programmes.')
          assert result.is_multi_programme, 'Should detect multi-programme response'
          assert 'horizon_europe' in result.programmes_found, 'Should detect Horizon Europe'
          assert 'erasmus_plus' in result.programmes_found, 'Should detect Erasmus+'
          print('Cross-programme accuracy validation: PASSED')
          "

      - name: Generate advanced metrics report
        if: always()
        run: |
          mkdir -p quality-reports

          cat > quality-reports/advanced-metrics.json << EOF
          {
            "workflow_run": "${{ github.run_number }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "advanced_tests": {
              "regression_status": "${{ steps.advanced_regression.outcome }}",
              "scenario_status": "${{ steps.advanced_scenarios.outcome }}",
              "goal_metrics_status": "${{ steps.goal_metrics.outcome }}",
              "personalization_status": "${{ steps.personalization_metrics.outcome }}",
              "cross_programme_status": "${{ steps.cross_programme_metrics.outcome }}"
            },
            "thresholds": {
              "goal_achievement": "${{ env.GOAL_ACHIEVEMENT_THRESHOLD }}",
              "personalization_min_fields": "${{ env.PERSONALIZATION_MIN_FIELDS }}",
              "cross_programme_accuracy": "${{ env.CROSS_PROGRAMME_ACCURACY_THRESHOLD }}"
            }
          }
          EOF

          echo "Advanced metrics report generated"

      - name: Upload advanced test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advanced-test-results
          path: |
            test-results/
            coverage/
            quality-reports/
          retention-days: 30

  # =============================================================================
  # Job 6: Quality Gate (PR Blocker)
  # =============================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, quality-validation, race-condition-tests, advanced-scenario-tests]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/
        continue-on-error: true

      - name: Download race condition results
        uses: actions/download-artifact@v4
        with:
          name: race-condition-results
          path: test-results/race/
        continue-on-error: true

      - name: Download advanced test results
        uses: actions/download-artifact@v4
        with:
          name: advanced-test-results
          path: test-results/advanced/
        continue-on-error: true

      - name: Run Quality Gate evaluation
        id: quality_gate
        run: |
          # Merge all test results into single directory
          mkdir -p test-results/all
          find test-results -name "*.xml" -exec cp {} test-results/all/ \; 2>/dev/null || true

          # Run quality gate script
          python scripts/quality_gate.py \
            --results-dir test-results/all \
            --quality-baseline tests/quality/results/conversation_quality_baseline.json \
            --threshold ${{ env.QUALITY_THRESHOLD }}

      - name: Quality Gate Failed
        if: failure()
        run: |
          echo "::error::Quality Gate FAILED - PR cannot be merged"
          echo "The following criteria must be met:"
          echo "  1. All scenario tests must pass"
          echo "  2. Quality score must be >= ${{ env.QUALITY_THRESHOLD }}"
          echo "  3. No race conditions detected"
          echo "  4. Context integrity must be maintained"
          echo "  5. Advanced scenario tests pass (goal achievement, personalization, cross-programme)"
          exit 1

  # =============================================================================
  # Job 7: Final Status Check
  # =============================================================================
  final-status:
    name: Final Status
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, quality-validation, race-condition-tests, advanced-scenario-tests, quality-gate]
    if: always()

    steps:
      - name: Check all job statuses
        run: |
          echo "=== Workflow Summary ==="
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Quality Validation: ${{ needs.quality-validation.result }}"
          echo "Race Condition Tests: ${{ needs.race-condition-tests.result }}"
          echo "Advanced Scenario Tests: ${{ needs.advanced-scenario-tests.result }}"
          echo "Quality Gate: ${{ needs.quality-gate.result }}"

          # Determine overall status
          if [ "${{ needs.unit-tests.result }}" == "failure" ]; then
            echo "FAILED: Unit tests failed"
            exit 1
          fi

          if [ "${{ needs.race-condition-tests.result }}" == "failure" ]; then
            echo "FAILED: Race condition tests failed - critical infrastructure regression"
            exit 1
          fi

          # Advanced scenario tests are important for conversation flow quality
          if [ "${{ needs.advanced-scenario-tests.result }}" == "failure" ]; then
            echo "WARNING: Advanced scenario tests failed - check goal/personalization/cross-programme"
            # Don't fail the workflow but warn
          fi

          # Quality Gate is critical for PRs
          if [ "${{ needs.quality-gate.result }}" == "failure" ]; then
            echo "FAILED: Quality gate failed - PR blocked"
            exit 1
          fi

          # Integration tests may be skipped if run_live_tests is false
          if [ "${{ needs.integration-tests.result }}" == "failure" ]; then
            echo "WARNING: Integration tests failed"
            # Don't fail the workflow for integration test failures
            # as they may be due to service connectivity issues
          fi

          echo "SUCCESS: All critical tests passed"

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## Conversation Stability Test Results

            | Test Suite | Status |
            |------------|--------|
            | Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || needs.integration-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | Quality Validation | ${{ needs.quality-validation.result == 'success' && '✅ Passed' || needs.quality-validation.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | Race Condition Tests | ${{ needs.race-condition-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Advanced Scenario Tests | ${{ needs.advanced-scenario-tests.result == 'success' && '✅ Passed' || needs.advanced-scenario-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | **Quality Gate** | ${{ needs.quality-gate.result == 'success' && '✅ Passed' || needs.quality-gate.result == 'skipped' && '⏭️ Skipped' || '❌ **BLOCKED**' }} |

            **Quality Threshold**: ${{ env.QUALITY_THRESHOLD }}

            ### Quality Gate Criteria
            - ✅ All scenario tests must pass
            - ✅ Quality score >= ${{ env.QUALITY_THRESHOLD }}
            - ✅ No race conditions detected
            - ✅ Context integrity maintained
            - ✅ Goal achievement metrics validated
            - ✅ Personalization quality checks pass
            - ✅ Cross-programme accuracy validated

            [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
