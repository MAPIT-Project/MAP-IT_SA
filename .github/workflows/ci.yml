name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: make install-dev

      - name: Lint with Ruff
        run: make lint

      # `make format` rewrites files, so CI invokes Black in check-only mode.
      # NOTE: non-blocking because the inherited baseline has 135 pre-existing
      # formatting violations (see KNOWN_ISSUES_AND_RISKS.md). A separate cleanup
      # pass (`make format` commit) is needed before this can be made blocking.
      - name: Check formatting with Black (non-blocking baseline)
        continue-on-error: true
        run: black --check app tests

      # Live API/database/provider checks require an explicit --run-live invocation
      # against a separate test instance. CI runs the guarded offline suite.
      - name: Run offline tests
        run: |
          mkdir -p test-results
          make test PYTEST_ARGS="--junitxml=test-results/pytest.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
