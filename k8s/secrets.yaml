---
# Secrets for sensitive configuration
# NOTE: In production, use external secret management (AWS Secrets Manager, HashiCorp Vault, etc.)
# This file is a template - DO NOT commit actual secrets!
apiVersion: v1
kind: Secret
metadata:
  name: mapit-secrets
  namespace: mapit
  labels:
    app: mapit
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://user:password@postgres-host:5432/mapit"
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_KEY: "your-supabase-key"

  # Neo4j
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "your-neo4j-password"

  # Redis
  REDIS_URL: "redis://redis:6379"

  # AI Providers
  GEMINI_API_KEY: "your-gemini-api-key"
  OPENAI_API_KEY: "your-openai-api-key"
  OPENROUTER_API_KEY: "your-openrouter-api-key"
  GOOGLE_EMBEDDING_API_KEY: "your-embedding-api-key"

  # Authentication
  JWT_SECRET_KEY: "your-super-secret-jwt-key-at-least-32-chars"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRY_HOURS: "24"

  # Encryption
  ENCRYPTION_KEY: "your-encryption-key-for-sensitive-data"
