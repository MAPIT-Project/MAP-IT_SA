---
# Ingress for MAP-IT API
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mapit-ingress
  namespace: mapit
  labels:
    app: mapit
  annotations:
    # NGINX Ingress Controller annotations
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-ID"

    # TLS with cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.mapit.example.com
      secretName: mapit-tls

  rules:
    - host: api.mapit.example.com
      http:
        paths:
          # Main API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mapit-api
                port:
                  number: 80

          # WebSocket routes for collaboration
          - path: /api/collaboration
            pathType: Prefix
            backend:
              service:
                name: mapit-api-ws
                port:
                  number: 80

          # Health check endpoint (public)
          - path: /api/health
            pathType: Prefix
            backend:
              service:
                name: mapit-api
                port:
                  number: 80

---
# Ingress for streaming endpoints (longer timeouts)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mapit-ingress-streaming
  namespace: mapit
  labels:
    app: mapit
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$binary_remote_addr"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.mapit.example.com
      secretName: mapit-tls

  rules:
    - host: api.mapit.example.com
      http:
        paths:
          # Streaming conversation endpoint
          - path: /api/v3/conversation
            pathType: Prefix
            backend:
              service:
                name: mapit-api
                port:
                  number: 80
